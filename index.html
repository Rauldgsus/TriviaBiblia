<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Bíblica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
    .font-serif {
      font-family: 'Lora', serif;
    }
    .font-sans {
      font-family: 'Montserrat', sans-serif;
    }

    /* Animations from target HTML */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .anim-fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    .anim-fade-out {
      animation: fadeOut 0.5s ease-in-out forwards;
    }
    .anim-fade-in-up {
      animation: fadeInUp 0.5s ease-in-out both;
    }
    .anim-pulse {
      animation: pulse 0.4s ease-in-out;
    }
    .anim-shake {
      animation: shake 0.5s ease-in-out;
    }

    .animation-delay-100 { animation-delay: 0.1s; }
    .animation-delay-200 { animation-delay: 0.2s; }
    .animation-delay-300 { animation-delay: 0.3s; }
    .animation-delay-400 { animation-delay: 0.4s; }
    .animation-delay-500 { animation-delay: 0.5s; }

    @keyframes enter {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes leave {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0; }
    }
    .animate-enter {
      animation: enter 0.2s ease-out forwards;
    }
    .animate-leave {
      animation: leave 0.15s ease-in forwards;
    }
    @keyframes pulseSubtle {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 15px -3px rgba(251, 191, 36, 0.1), 0 4px 6px -2px rgba(251, 191, 36, 0.05); }
      50% { transform: scale(1.01); box-shadow: 0 20px 25px -5px rgba(251, 191, 36, 0.2), 0 10px 10px -5px rgba(251, 191, 36, 0.1); }
    }
    .animate-pulse-subtle {
      animation: pulseSubtle 2s infinite ease-in-out;
    }

    .bg-gradient-celestial {
        background: linear-gradient(135deg, #e0f2f1 0%, #fff3e0 100%);
    }

    /* Styles for Memory Card 3D Flip */
    .perspective {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .rotateY-0 {
      transform: rotateY(0deg);
    }
    .rotateY-180 {
      transform: rotateY(180deg);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden; /* Safari */
    }

    /* Intro Logo Animation */
    .intro-logo-animate {
      animation: popInBounce 2.5s ease-out forwards;
    }
    @keyframes popInBounce {
      0% { opacity: 0; transform: scale(0.5) translateY(30px); }
      60% { opacity: 1; transform: scale(1.1) translateY(-10px); }
      80% { transform: scale(0.95) translateY(0px); }
      100% { opacity: 1; transform: scale(1) translateY(0px); }
    }

  </style>

}

</head>

</html>
